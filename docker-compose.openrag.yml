# Docker Compose override for Open-rag.ai integration
# Usage:
#   1. Copy .env.example to .env and configure your credentials
#   2. docker compose -f docker-compose.yml -f docker-compose.openrag.yml up --build
#
# This configuration removes the local LLM service and configures the backend
# to use your Open-rag.ai RAG partition instead.

services:
  backend:
    env_file:
      - .env
    environment:
      # Other optional environment variables remain the same
      - KYUTAI_STT_URL=ws://stt:8080
      - KYUTAI_TTS_URL=ws://tts:8080
      - NEWSAPI_API_KEY=${NEWSAPI_API_KEY}

  # Remove the llm service since we're using an external API
  llm:
    deploy:
      replicas: 0
